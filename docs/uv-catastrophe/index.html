  <body>
    <div class="page">
      <header class="masthead">
        <h1>The ultraviolet catastrophe, from your own code</h1>
        <p id="caption"></p>
      </header>
      <noscript><p class="noscript">This page runs the simulation in JavaScript. Turn JavaScript on to see the figures and readouts.</p></noscript>
      <main class="layout">
        <section class="controls" aria-label="Controls">
          <div class="control">
            <div class="control-head">
              <label for="cutoff">Cutoff</label>
              <output id="rc-out" for="cutoff"></output>
            </div>
            <input id="cutoff" type="range" aria-describedby="lmin-out" />
            <p class="hint" id="lmin-out"></p>
            <p class="hint">Drag right to count shorter wavelengths.</p>
          </div>
          <div class="control">
            <div class="control-head">
              <label for="temp">Temperature</label>
              <output id="t-out" for="temp"></output>
            </div>
            <input id="temp" type="range" />
          </div>
        </section>

        <div class="figs">
          <figure class="fig">
            <figcaption>
              <span class="fig-title"><span class="fig-no">Fig. 1</span>Total energy in the box against the cutoff</span>
              <ul class="key" aria-label="Key">
                <li><span class="sw sw-line sw-classical" aria-hidden="true"></span>classical (Rayleigh–Jeans)</li>
                <li><span class="sw sw-line sw-planck" aria-hidden="true"></span>Planck</li>
                <li><span class="sw sw-line sw-ref" aria-hidden="true"></span>aT⁴V (Stefan–Boltzmann)</li>
              </ul>
              <p class="verdict" aria-live="polite">
                Up to this cutoff, classical physics puts <strong class="classical"><span id="v-rj"></span> × aT⁴V</strong>
                of energy in the box. Planck puts <strong class="planck"><span id="v-p"></span> × aT⁴V</strong>.
              </p>
            </figcaption>
            <canvas id="totals" role="img" aria-label="Total energy, classical and Planck, against the cutoff index, in units of aT⁴V"></canvas>
          </figure>
          <figure class="fig">
            <figcaption>
              <span class="fig-title"><span class="fig-no">Fig. 2</span>Spectrum of the modes up to the cutoff</span>
              <ul class="key" aria-label="Key">
                <li><span class="sw sw-bar" aria-hidden="true"></span>Planck, counted modes</li>
                <li><span class="sw sw-step" aria-hidden="true"></span>classical, counted modes</li>
                <li><span class="sw sw-thin" aria-hidden="true"></span>Planck, continuum</li>
                <li><span class="sw sw-dot" aria-hidden="true"></span>classical, continuum</li>
              </ul>
            </figcaption>
            <canvas id="spectrum" role="img" aria-label="Spectral energy density against frequency, classical and Planck"></canvas>
          </figure>
        </div>

        <section class="readouts" aria-label="Readouts">
          <h2>Modes up to the cutoff</h2>
          <dl>
            <dt>modes counted</dt><dd id="r-modes"></dd>
            <dt class="classical">U classical</dt><dd id="r-urj"></dd>
            <dt class="planck">U Planck</dt><dd id="r-up"></dd>
            <dt>U Planck / aT⁴V</dt><dd id="r-ratio"></dd>
            <dt>ε = hc / 2LkT</dt><dd id="r-eps"></dd>
          </dl>

          <h2>Wien peaks <span class="aside">(all modes, cutoff ignored)</span></h2>
          <dl>
            <dt id="d-lt">λ<sub>max</sub> · T</dt><dd id="r-lt"></dd>
            <dt id="d-ft">f<sub>max</sub> / T</dt><dd id="r-ft"></dd>
            <dt id="d-prod">λ<sub>max</sub> · f<sub>max</sub> / c</dt><dd id="r-prod"></dd>
          </dl>
        </section>
      </main>
    </div>
  </body>
