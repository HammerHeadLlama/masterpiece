<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UV Catastrophe</title>
    <style>
      /* ---------------------------------------------------------------- tokens (DESIGN.md) */
      :root {
        --bg: #f7f3ea;
        --panel: #fffdf8;
        --fg: #1c1917;
        --muted: #57534e;
        --dim: #6e6862;
        --grid: #e7e1d5;
        --border: #d9d1c2;
        --rule: #e7e1d5;
        --classical: #b4320c;
        --planck: #1e40af;
        --ring: #1e40af;
        --halo: #fffdf8;
        --bar-alpha: 0.72;
        --band-alpha: 0.18;
        --shade-alpha: 0.55;

        --font-ui: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --font-display: ui-serif, 'Iowan Old Style', Charter, 'Palatino Linotype', Georgia, serif;
        --text-xs: 12px;
        --text-sm: 14px;
        --text-md: 16px;
        --text-lg: 20px;
        --text-xl: 28px;
        --text-hero: 44px;
        --leading: 1.5;

        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 24px;
        --space-6: 32px;
        --space-7: 48px;
        --radius: 2px;
        --radius-round: 999px;
        --sidebar: 340px;
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --dur-press: 120ms;
        --dur-fade: 160ms;
        /* figure canvas height: both figures fit a 720px laptop screen */
        --fig-h: clamp(232px, calc((100dvh - 330px) / 2), 400px);

        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #151311;
          --panel: #1d1a17;
          --fg: #ede8e0;
          --muted: #a8a29e;
          --dim: #948d86;
          --grid: #2e2a25;
          --border: #3a352f;
          --rule: #2e2a25;
          --classical: #f59e68;
          --planck: #8ab4f8;
          --ring: #8ab4f8;
          --halo: #1d1a17;
          --bar-alpha: 0.62;
          --band-alpha: 0.26;
          --shade-alpha: 0.6;
          color-scheme: dark;
        }
      }
      :root[data-theme='dark'] {
        --bg: #151311;
        --panel: #1d1a17;
        --fg: #ede8e0;
        --muted: #a8a29e;
        --dim: #948d86;
        --grid: #2e2a25;
        --border: #3a352f;
        --rule: #2e2a25;
        --classical: #f59e68;
        --planck: #8ab4f8;
        --ring: #8ab4f8;
        --halo: #1d1a17;
        --bar-alpha: 0.62;
        --band-alpha: 0.26;
        --shade-alpha: 0.6;
        color-scheme: dark;
      }

      /* ---------------------------------------------------------------- base */
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: var(--text-sm) / var(--leading) var(--font-ui);
        -webkit-font-smoothing: antialiased;
      }
      ::selection { background: color-mix(in srgb, var(--planck) 24%, transparent); }
      :focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; border-radius: var(--radius); }
      .page { max-width: 1440px; margin: 0 auto; padding: var(--space-5) var(--space-5) var(--space-6); }

      /* ---------------------------------------------------------------- masthead */
      .masthead { margin-bottom: var(--space-5); }
      h1 {
        margin: 0;
        font: 600 var(--text-xl) / 1.15 var(--font-display);
        letter-spacing: -0.01em;
        text-wrap: balance;
      }
      #caption { margin: var(--space-2) 0 0; color: var(--muted); max-width: 72ch; text-wrap: pretty; }

      /* ---------------------------------------------------------------- layout */
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) var(--sidebar);
        grid-template-areas:
          'figs controls'
          'figs readouts';
        grid-template-rows: auto 1fr;
        column-gap: var(--space-6);
        row-gap: var(--space-5);
        align-items: start;
      }
      .figs { grid-area: figs; display: grid; gap: var(--space-5); min-width: 0; }
      .controls { grid-area: controls; }
      .readouts { grid-area: readouts; }

      /* ---------------------------------------------------------------- figures */
      .fig { margin: 0; min-width: 0; }
      .fig figcaption {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: var(--space-1) var(--space-3);
        margin-bottom: var(--space-2);
      }
      .fig-title { font: 600 var(--text-md) / 1.3 var(--font-display); }
      .fig-no { color: var(--muted); font-weight: 400; margin-right: var(--space-2); }
      .verdict {
        flex-basis: 100%;
        margin: 0;
        font: var(--text-md) / 1.4 var(--font-display);
        font-variant-numeric: tabular-nums;
        text-wrap: pretty;
      }
      .verdict strong { font-weight: 600; white-space: nowrap; }
      .verdict .classical { color: var(--classical); }
      .verdict .planck { color: var(--planck); }
      .key {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-1) var(--space-4);
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: var(--text-xs);
        color: var(--muted);
      }
      .key li { display: inline-flex; align-items: center; gap: var(--space-2); }
      /* swatches mirror the canvas strokes (plot.ts) */
      .sw { display: inline-block; flex: none; width: 22px; }
      .sw-line { height: 0; border-top: 2.5px solid; }
      .sw-classical { border-color: var(--classical); border-top-style: dashed; }
      .sw-planck { border-color: var(--planck); }
      .sw-ref { border-color: var(--fg); border-top-width: 1.5px; border-top-style: dotted; }
      .sw-bar { height: 10px; background: var(--planck); opacity: var(--bar-alpha); }
      .sw-step { height: 10px; border: 1.5px solid var(--classical); border-bottom: 0; }
      .sw-thin { height: 0; border-top: 1.5px solid var(--planck); }
      .sw-dot { height: 0; border-top: 2px dotted var(--classical); }
      canvas {
        display: block;
        width: 100%;
        height: var(--fig-h);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }

      /* ---------------------------------------------------------------- controls */
      .controls {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: var(--space-4) var(--space-4) var(--space-3);
      }
      .control + .control { margin-top: var(--space-4); padding-top: var(--space-4); border-top: 1px solid var(--rule); }
      .control-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-2); }
      .control-head label { font-weight: 600; font-size: var(--text-md); }
      .control-head output { font-variant-numeric: tabular-nums; font-size: var(--text-md); }
      .hint { margin: 0; color: var(--muted); font-size: var(--text-xs); font-variant-numeric: tabular-nums; }

      input[type='range'] {
        -webkit-appearance: none;
        appearance: none;
        display: block;
        width: 100%;
        height: 28px;
        margin: var(--space-1) 0;
        background: transparent;
        cursor: pointer;
      }
      input[type='range']:focus-visible { outline-offset: 2px; border-radius: var(--radius-round); }
      input[type='range']::-webkit-slider-runnable-track {
        height: 6px;
        border-radius: var(--radius-round);
        background: var(--border);
      }
      input[type='range']::-moz-range-track {
        height: 6px;
        border-radius: var(--radius-round);
        background: var(--border);
      }
      input[type='range']::-moz-range-progress {
        height: 6px;
        border-radius: var(--radius-round);
        background: var(--fg);
      }
      input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 24px;
        height: 24px;
        margin-top: -9px;
        border-radius: 50%;
        background: var(--panel);
        border: 2px solid var(--fg);
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.18);
        cursor: grab;
        transition:
          transform var(--dur-press) var(--ease-out),
          box-shadow var(--dur-press) var(--ease-out);
      }
      input[type='range']::-moz-range-thumb {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--panel);
        border: 2px solid var(--fg);
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.18);
        cursor: grab;
        transition:
          transform var(--dur-press) var(--ease-out),
          box-shadow var(--dur-press) var(--ease-out);
      }
      /* hover only where a real pointer can hover */
      @media (hover: hover) and (pointer: fine) {
        input[type='range']:hover::-webkit-slider-thumb {
          box-shadow: 0 1px 3px rgb(0 0 0 / 0.18), 0 0 0 5px color-mix(in srgb, var(--fg) 10%, transparent);
        }
        input[type='range']:hover::-moz-range-thumb {
          box-shadow: 0 1px 3px rgb(0 0 0 / 0.18), 0 0 0 5px color-mix(in srgb, var(--fg) 10%, transparent);
        }
      }
      /* press: the thumb lifts, confirming the grab */
      input[type='range']:active { cursor: grabbing; }
      input[type='range']:active::-webkit-slider-thumb {
        cursor: grabbing;
        transform: scale(1.12);
        box-shadow: 0 2px 6px rgb(0 0 0 / 0.22), 0 0 0 6px color-mix(in srgb, var(--fg) 14%, transparent);
      }
      input[type='range']:active::-moz-range-thumb {
        cursor: grabbing;
        transform: scale(1.12);
        box-shadow: 0 2px 6px rgb(0 0 0 / 0.22), 0 0 0 6px color-mix(in srgb, var(--fg) 14%, transparent);
      }

      /* ---------------------------------------------------------------- readouts */
      .readouts h2 {
        margin: 0 0 var(--space-2);
        font: 600 var(--text-md) / 1.3 var(--font-display);
      }
      .readouts h2 .aside { font: 400 var(--text-xs) / 1.3 var(--font-ui); color: var(--muted); }
      .readouts dl + h2 { margin-top: var(--space-5); }
      dl {
        margin: 0;
        display: grid;
        grid-template-columns: auto 1fr;
        column-gap: var(--space-3);
      }
      dt, dd { padding: var(--space-2) 0; border-top: 1px solid var(--rule); }
      dt { color: var(--muted); }
      dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
      dd .note {
        display: block;
        font-size: var(--text-xs);
        transition: opacity var(--dur-fade) ease;
        @starting-style { opacity: 0; }
      }
      dt, dd { transition: color var(--dur-fade) ease; }
      .readouts dt.dimmed,
      .readouts dt.dimmed + dd { color: var(--dim); }

      /* empty state: before the script fills a value */
      dd:empty::before,
      .verdict span:empty::before { content: '–'; color: var(--dim); }
      .noscript {
        margin: 0 0 var(--space-4);
        padding: var(--space-3) var(--space-4);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--panel);
      }

      @media (prefers-reduced-motion: reduce) {
        /* keep the colour and opacity fades; drop the thumb's movement */
        input[type='range']::-webkit-slider-thumb { transition: box-shadow var(--dur-press) ease; }
        input[type='range']::-moz-range-thumb { transition: box-shadow var(--dur-press) ease; }
        input[type='range']:active::-webkit-slider-thumb { transform: none; }
        input[type='range']:active::-moz-range-thumb { transform: none; }
      }
      .readouts dt.classical { color: var(--classical); }
      .readouts dt.planck { color: var(--planck); }

      /* ---------------------------------------------------------------- narrow screens */
      @media (max-width: 999px) {
        .page { padding: var(--space-4) var(--space-4) var(--space-6); }
        h1 { font-size: var(--text-lg); }
        .layout {
          grid-template-columns: minmax(0, 1fr);
          grid-template-areas: 'controls' 'figs' 'readouts';
          grid-template-rows: auto;
        }
        /* keep the sliders in reach while the figures scroll under them */
        .controls {
          position: sticky;
          top: 0;
          z-index: 1;
          margin: 0 calc(-1 * var(--space-4));
          border-width: 0 0 1px;
          border-radius: 0;
          padding: var(--space-3) var(--space-4) var(--space-2);
        }
        .control + .control { margin-top: var(--space-2); padding-top: var(--space-2); }
        :root { --fig-h: 280px; }
      }
      @media (max-width: 999px) and (min-width: 600px) {
        .controls { display: grid; grid-template-columns: 1fr 1fr; column-gap: var(--space-5); }
        .control + .control { margin-top: 0; padding-top: 0; border-top: 0; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <h1>The ultraviolet catastrophe, from your own code</h1>
        <p id="caption"></p>
      </header>
      <noscript><p class="noscript">This page runs the simulation in JavaScript. Turn JavaScript on to see the figures and readouts.</p></noscript>
      <main class="layout">
        <section class="controls" aria-label="Controls">
          <div class="control">
            <div class="control-head">
              <label for="cutoff">Cutoff</label>
              <output id="rc-out" for="cutoff"></output>
            </div>
            <input id="cutoff" type="range" aria-describedby="lmin-out" />
            <p class="hint" id="lmin-out"></p>
            <p class="hint">Drag right to count shorter wavelengths.</p>
          </div>
          <div class="control">
            <div class="control-head">
              <label for="temp">Temperature</label>
              <output id="t-out" for="temp"></output>
            </div>
            <input id="temp" type="range" />
          </div>
        </section>

        <div class="figs">
          <figure class="fig">
            <figcaption>
              <span class="fig-title"><span class="fig-no">Fig. 1</span>Total energy in the box against the cutoff</span>
              <ul class="key" aria-label="Key">
                <li><span class="sw sw-line sw-classical" aria-hidden="true"></span>classical (Rayleigh–Jeans)</li>
                <li><span class="sw sw-line sw-planck" aria-hidden="true"></span>Planck</li>
                <li><span class="sw sw-line sw-ref" aria-hidden="true"></span>aT⁴V (Stefan–Boltzmann)</li>
              </ul>
              <p class="verdict" aria-live="polite">
                Up to this cutoff, classical physics puts <strong class="classical"><span id="v-rj"></span> × aT⁴V</strong>
                of energy in the box. Planck puts <strong class="planck"><span id="v-p"></span> × aT⁴V</strong>.
              </p>
            </figcaption>
            <canvas id="totals" role="img" aria-label="Total energy, classical and Planck, against the cutoff index, in units of aT⁴V"></canvas>
          </figure>
          <figure class="fig">
            <figcaption>
              <span class="fig-title"><span class="fig-no">Fig. 2</span>Spectrum of the modes up to the cutoff</span>
              <ul class="key" aria-label="Key">
                <li><span class="sw sw-bar" aria-hidden="true"></span>Planck, counted modes</li>
                <li><span class="sw sw-step" aria-hidden="true"></span>classical, counted modes</li>
                <li><span class="sw sw-thin" aria-hidden="true"></span>Planck, continuum</li>
                <li><span class="sw sw-dot" aria-hidden="true"></span>classical, continuum</li>
              </ul>
            </figcaption>
            <canvas id="spectrum" role="img" aria-label="Spectral energy density against frequency, classical and Planck"></canvas>
          </figure>
        </div>

        <section class="readouts" aria-label="Readouts">
          <h2>Modes up to the cutoff</h2>
          <dl>
            <dt>modes counted</dt><dd id="r-modes"></dd>
            <dt class="classical">U classical</dt><dd id="r-urj"></dd>
            <dt class="planck">U Planck</dt><dd id="r-up"></dd>
            <dt>U Planck / aT⁴V</dt><dd id="r-ratio"></dd>
            <dt>ε = hc / 2LkT</dt><dd id="r-eps"></dd>
          </dl>

          <h2>Wien peaks <span class="aside">(all modes, cutoff ignored)</span></h2>
          <dl>
            <dt id="d-lt">λ<sub>max</sub> · T</dt><dd id="r-lt"></dd>
            <dt id="d-ft">f<sub>max</sub> / T</dt><dd id="r-ft"></dd>
            <dt id="d-prod">λ<sub>max</sub> · f<sub>max</sub> / c</dt><dd id="r-prod"></dd>
          </dl>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
